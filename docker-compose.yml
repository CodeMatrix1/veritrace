services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: veritrace
      POSTGRES_PASSWORD: veritrace
      POSTGRES_DB: veritrace
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://veritrace:veritrace@db:5432/veritrace
    ports:
      - "7860:7860"
    depends_on:
      - db

volumes:
  pgdata:

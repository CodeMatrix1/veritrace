<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Veritrace</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <header>
      <span class="brand"><span class="mark"></span>Veritrace</span>
      <nav>
        <button id="tab-check" class="tab active">Check</button>
        <button id="tab-ask" class="tab">Ask</button>
        <button id="tab-history" class="tab">History</button>
      </nav>
    </header>
    <main id="content" aria-live="polite"></main>
    <footer>
      <p id="limit" class="muted"></p>
      <a id="report" class="button" target="_blank" rel="noreferrer">View all audits</a>
    </footer>
    <script src="config.js"></script>
    <script src="panel.js"></script>
  </body>
</html>
